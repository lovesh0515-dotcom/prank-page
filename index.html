<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>☕ CoffeePay</title>

<meta name="description" content="특별한 선물이 도착했습니다.">

<meta property="og:type" content="website">
<meta property="og:title" content="☕ CoffeePay">
<meta property="og:description" content="🎁 특별한 선물이 도착했습니다!">
<meta property="og:image" content="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=1200">
<meta property="og:url" content="">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Pretendard,Arial,sans-serif;
}

body{

background:#ffe54d;

display:flex;
justify-content:center;
align-items:center;

height:100vh;

overflow:hidden;

}

.card{

width:360px;

background:white;

border-radius:28px;

box-shadow:0 20px 40px rgba(0,0,0,.15);

overflow:hidden;

}

.header{

background:#ffe000;

padding:35px;

text-align:center;

}

.logo{

font-size:46px;

}

.header h1{

margin-top:10px;

font-size:34px;

}

.content{

padding:30px;

text-align:center;

}

.money{

font-size:42px;

font-weight:bold;

margin:20px 0;

}

.desc{

font-size:18px;

color:#666;

line-height:1.5;

}

button{

width:100%;

margin-top:35px;

padding:18px;

font-size:24px;

font-weight:bold;

background:#222;

color:white;

border:none;

border-radius:16px;

cursor:pointer;

transition:.25s;

}

button:hover{

transform:scale(1.03);

}

#result{

display:none;

}

.result{

background:#111;

color:white;

}

.big{

font-size:65px;

margin-top:20px;

}

.success{

font-size:42px;

font-weight:bold;

margin-top:15px;

}

.coffee{

font-size:24px;

margin-top:20px;

line-height:1.7;

}

</style>

</head>

<body>

<div class="card" id="start">

<div class="header">

<div class="logo">

☕

</div>

<h1>

CoffeePay

</h1>

</div>

<div class="content">

<div class="money">

🎁 1,000,000 Point

</div>

<div class="desc">

특별한 커피 포인트가 도착했습니다.<br>

버튼을 눌러 확인해보세요.

</div>

<button onclick="openGift()">

선물 열기

</button>

</div>

</div>

<div class="card result" id="result">

<div class="content">

<div class="big">

😂

</div>

<div class="success">

속았지?

</div>

<div class="coffee">

🎉 만우절 장난 성공!<br><br>

☕ 커피는 한 잔은 네가 사라!

</div>

<button onclick="location.reload()">

다시 보기

</button>

</div>

</div>

<script>

function fire(){

confetti({
particleCount:250,
spread:180,
origin:{y:0.6}
});

setTimeout(()=>{

confetti({
particleCount:120,
angle:60,
origin:{x:0}
});

confetti({
particleCount:120,
angle:120,
origin:{x:1}
});

},250);

}

function openGift(){

document.getElementById("start").style.display="none";

document.getElementById("result").style.display="block";

fire();

}

</script>

</body>

</html>
